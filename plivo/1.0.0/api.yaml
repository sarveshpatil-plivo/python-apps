walkoff_version: 1.0.0
app_version: 1.0.0
name: plivo
description: Send SMS from Shuffle through Plivo.
tags:
  - Communication
  - SMS
categories:
  - Communication
contact_info:
  name: "Sarvesh Patil"
  url: https://github.com/sarveshpatil-plivo
  email: "sarvesh.patil@plivo.com"
authentication:
  required: true
  parameters:
    - name: url
      description: Plivo Messages API URL for your account.
      example: "https://api.plivo.com/v1/Account/YOUR_AUTH_ID/Message/"
      required: true
      schema:
        type: string
    - name: username
      description: Your Plivo Auth ID
      multiline: false
      required: true
      example: "Auth ID"
      schema:
        type: string
    - name: password
      description: Your Plivo Auth Token
      multiline: false
      required: true
      example: "*****"
      schema:
        type: string
    - name: headers
      description: Headers to use
      multiline: true
      required: false
      example: "Content-Type: application/json"
      schema:
        type: string
actions:
  - name: Send_SMS
    description: Sends an SMS through the Plivo Messages API. Each call sends and bills a new message.
    parameters:
      - name: url
        description: Plivo Messages API URL for your account
        multiline: false
        example: "https://api.plivo.com/v1/Account/YOUR_AUTH_ID/Message/"
        required: true
        schema:
          type: string
      - name: headers
        description: Headers to use
        multiline: true
        required: false
        example: "Content-Type: application/json"
        schema:
          type: string
      - name: username
        description: Your Plivo Auth ID
        multiline: false
        required: true
        example: "Auth ID"
        schema:
          type: string
      - name: password
        description: Your Plivo Auth Token
        multiline: false
        required: true
        example: "*****"
        schema:
          type: string
      - name: timeout
        description: Add a timeout (in seconds) for the request
        multiline: false
        required: false
        example: "10"
        schema:
          type: string
      - name: body
        description: The message to send.
        multiline: true
        example: "Your monitored service is back up."
        required: true
        schema:
          type: string
      - name: From
        description: The sender ID, a Plivo phone number, short code, or where allowed an alphanumeric text sender.
        multiline: false
        example: "+14150000002"
        required: true
        schema:
          type: string
      - name: To
        description: The receiver phone number, or a comma separated list of numbers, sent as one Plivo request.
        multiline: false
        example: "+14150000001,+14150000003"
        required: true
        schema:
          type: string
    returns:
      schema:
        type: string
      example: '{"success": true, "status": "200", "url": "https://api.plivo.com/v1/Account/YOUR_AUTH_ID/Message/", "results": [{"success": true, "status": 202, "url": "https://api.plivo.com/v1/Account/YOUR_AUTH_ID/Message/", "headers": {}, "body": {"message": "message(s) queued", "message_uuid": ["db3ce55a-7f1d-11e1-8ea7-1231380bc196"], "api_id": "db342550-7f1d-11e1-8ea7-1231380bc196"}, "cookies": {}}]}'
